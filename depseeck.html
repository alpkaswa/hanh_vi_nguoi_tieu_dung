<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn tập Hành vi tiêu dùng by hoang minh</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #eef2f7;
    margin: 0;
    padding: 20px;
    color: #1f2937;
    line-height: 1.6;
  }
  header {
    max-width: 960px;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: #fff;
    padding: 24px;
    border-radius: 14px;
    box-shadow: 0 6px 20px rgba(37,99,235,.25);
  }
  header h1 { margin: 0 0 6px; font-size: 24px; }
  header p { margin: 0; opacity: .9; font-size: 14px; }

  .toolbar {
    max-width: 960px;
    margin: 0 auto 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    background: #fff;
    padding: 14px 18px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
    position: sticky;
    top: 10px;
    z-index: 50;
  }
  .toolbar .score { font-weight: 700; color: #2563eb; }
  .toolbar button {
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    background: #2563eb;
    color: #fff;
    transition: .2s;
  }
  .toolbar button:hover { background: #1d4ed8; }
  .toolbar button.ghost { background: #e5e7eb; color: #374151; }
  .toolbar button.ghost:hover { background: #d1d5db; }
  .toolbar select {
    max-width: 100%;
    padding: 8px 34px 8px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    background: #fff;
    color: #1f2937;
    font-size: 14px;
  }

  .lesson-title {
    max-width: 960px;
    margin: 28px auto 12px;
    font-size: 20px;
    font-weight: 800;
    color: #111827;
    border-left: 6px solid #7c3aed;
    padding-left: 12px;
  }

  .q-card {
    max-width: 960px;
    margin: 0 auto 16px;
    background: #fff;
    border-radius: 12px;
    padding: 18px 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
    border: 2px solid transparent;
    transition: .2s;
  }
  .q-card.correct { border-color: #22c55e; background: #f0fdf4; }
  .q-card.wrong { border-color: #ef4444; background: #fef2f2; }

  .q-head { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 12px; }
  .q-num {
    flex: 0 0 auto;
    background: #7c3aed;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .q-text { font-weight: 600; font-size: 15.5px; }
  .q-note { font-size: 13px; color: #6b7280; font-style: italic; margin-top: 4px; }

  .options { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
  .opt {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 10px 12px;
    border: 1.5px solid #e5e7eb;
    border-radius: 8px;
    cursor: pointer;
    transition: .15s;
    font-size: 14.5px;
  }
  .opt:hover { background: #f9fafb; border-color: #c4b5fd; }
  .opt input { margin-top: 3px; flex: 0 0 auto; }
  .opt.sel { background: #ede9fe; border-color: #7c3aed; }
  .opt.ok { background: #dcfce7; border-color: #22c55e; }
  .opt.bad { background: #fee2e2; border-color: #ef4444; }
  .opt .mark { margin-left: auto; font-weight: 700; }
  .opt.ok .mark { color: #16a34a; }
  .opt.bad .mark { color: #dc2626; }

  .tf-row {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 9px 12px;
    border-radius: 8px;
    background: #f9fafb;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .tf-text { flex: 1 1 380px; font-size: 14.5px; }
  .tf-btns { display: flex; gap: 6px; }
  .tf-btns button {
    padding: 5px 14px;
    border: 1.5px solid #d1d5db;
    background: #fff;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    transition: .15s;
  }
  .tf-btns button:hover { border-color: #7c3aed; }
  .tf-btns button.active { background: #7c3aed; color: #fff; border-color: #7c3aed; }
  .tf-row.ok { background: #dcfce7; }
  .tf-row.bad { background: #fee2e2; }
  .tf-mark { font-weight: 700; margin-left: 6px; }

  .fill-wrap { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
  .fill-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .fill-line label { font-size: 14px; font-weight: 600; color: #4b5563; }
  .fill-line input {
    flex: 1 1 220px;
    padding: 9px 12px;
    border: 1.5px solid #d1d5db;
    border-radius: 8px;
    font-size: 14.5px;
    outline: none;
  }
  .fill-line input:focus { border-color: #7c3aed; }

  .match-wrap { margin: 10px 0; }
  .match-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .match-left {
    flex: 1 1 260px;
    background: #f3f4f6;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14.5px;
    font-weight: 500;
  }
  .dropzone {
    flex: 1 1 260px;
    min-height: 44px;
    border: 2px dashed #c4b5fd;
    border-radius: 8px;
    padding: 6px;
    background: #faf5ff;
    display: flex;
    align-items: center;
    transition: .15s;
  }
  .dropzone.over { background: #ede9fe; border-color: #7c3aed; }
  .dropzone .chip { width: 100%; }
  .dropzone .placeholder { color: #a78bfa; font-size: 13px; font-style: italic; padding-left: 6px; }
  .pool {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px;
    border-radius: 10px;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    min-height: 52px;
    margin-top: 8px;
  }
  .chip {
    background: #7c3aed;
    color: #fff;
    padding: 7px 12px;
    border-radius: 8px;
    font-size: 13.5px;
    cursor: grab;
    user-select: none;
    box-shadow: 0 1px 3px rgba(0,0,0,.15);
  }
  .chip:active { cursor: grabbing; }
  .chip.ok { background: #16a34a; }
  .chip.bad { background: #dc2626; }
  .match-row.ok .match-left { background: #dcfce7; }
  .match-row.bad .match-left { background: #fee2e2; }

  .q-actions { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .btn-check {
    padding: 8px 20px; border: none; border-radius: 8px;
    background: #7c3aed; color: #fff; font-weight: 700; cursor: pointer; font-size: 14px;
  }
  .btn-check:hover { background: #6d28d9; }
  .btn-retry {
    padding: 8px 20px; border: none; border-radius: 8px;
    background: #f59e0b; color: #fff; font-weight: 700; cursor: pointer; font-size: 14px;
  }
  .btn-retry:hover { background: #d97706; }
  .btn-show {
    padding: 8px 16px; border: 1.5px solid #d1d5db; border-radius: 8px;
    background: #fff; color: #374151; font-weight: 600; cursor: pointer; font-size: 13.5px;
  }
  .btn-show:hover { background: #f3f4f6; }
  .result-msg { font-weight: 700; font-size: 14px; }
  .result-msg.ok { color: #16a34a; }
  .result-msg.bad { color: #dc2626; }

  .footer-bar {
    max-width: 960px;
    margin: 30px auto;
    text-align: center;
    color: #6b7280;
    font-size: 13px;
  }

  @media (max-width: 600px) {
    body { padding: 10px; }
    .toolbar { position: static; }
    .q-card { padding: 14px; }
  }
</style>
</head>
<body>

<header>
  <h1>📚 Ôn tập: Hành vi người tiêu dùng</h1>
  <p>Tổng hợp đầy đủ câu hỏi từ Bài 1 → Bài 8 · Tự động chấm điểm · Làm lại câu sai</p>
</header>

<div class="toolbar">
  <span>Điểm: <span class="score" id="score">0 / 0</span></span>
  <span style="color:#9ca3af">|</span>
  <span>Đúng: <b id="cntOk" style="color:#16a34a">0</b></span>
  <span>Sai: <b id="cntBad" style="color:#dc2626">0</b></span>
  <label for="lessonPicker">Bài:</label>
  <select id="lessonPicker" onchange="filterLessons(this.value)" aria-label="Chọn bài ôn tập">
    <option value="all">Tất cả bài</option>
  </select>
  <button class="ghost" onclick="resetAll()">🔄 Làm lại tất cả</button>
  <button class="ghost" onclick="scrollToTop()">⬆ Lên đầu</button>
</div>

<div id="app"></div>

<div class="footer-bar">Chúc bạn ôn tập tốt! 💪</div>

<script>

      blanks:[["thanh toán điện tử","thanh toan dien tu"]] },

    { type:"tf",
      q:"Xác định nhận định sau là đúng/sai: Nội dung từ KOLs và Influencers thường có tác động đến quyết định mua hàng mạnh mẽ hơn các quảng cáo truyền thống của doanh nghiệp.",
      statements:[
        { text:"Nội dung từ KOLs và Influencers thường có tác động đến quyết định mua hàng mạnh mẽ hơn các quảng cáo truyền thống của doanh nghiệp.", correct:true }
      ]},

    { type:"match",
      q:"Ghép đặc điểm của mạng xã hội với tác động đến tiêu dùng:",
      pairs:[
        ["Tác động từ Influencers", "Tăng mức độ tin cậy sản phẩm qua uy tín của người nổi tiếng"],
        ["Cung cấp thông tin nhanh", "Khách hàng tiếp cận thông tin đa chiều từ nhiều nguồn"],
        ["Hiệu ứng lan truyền (Viral)", "Video hấp dẫn lan truyền khiến đơn hàng tăng đột biến"]
      ]},

    { type:"single",
      q:"Logistics và dịch vụ giao hàng ảnh hưởng như thế nào đến hành vi tiêu dùng trực tuyến?",
      options:[
        "Rút ngắn thời gian giao hàng giúp tăng sự hài lòng và khuyến khích mua sắm thường xuyên.",
        "Không có tác động gì đến sự hài lòng của khách hàng.",
        "Chỉ quan trọng đối với những mặt hàng có giá trị cực thấp.",
        "Giao hàng chậm giúp khách hàng có thêm thời gian suy nghĩ về việc trả hàng."
      ], correct:[0] },

    { type:"single",
      q:"Hành vi \"Mua sắm đa kênh\" (Omnichannel Shopping) được hiểu là gì?",
      options:[
        "Khách hàng có thể sử dụng nhiều tài khoản khác nhau cho mỗi kênh bán hàng.",
        "Khách hàng được phép mua hàng tại website của nhiều hãng khác nhau.",
        "Sự kết hợp liền mạch giữa website, mạng xã hội, ứng dụng và cửa hàng truyền thống.",
        "Việc doanh nghiệp đóng cửa toàn bộ các chi nhánh trực tiếp để bán online."
      ], correct:[2] }
  ]
}
];

/* ================== LOGIC ================== */
let stats = { ok: 0, bad: 0 };
const totalQuestions = DATA.reduce((s, l) => s + l.items.length, 0);

function normalize(s) {
  return (s || "").toString()
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/đ/g, "d")
    .replace(/[.,!?;:'"`()\[\]{}]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function shuffle(a) {
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

let uidCounter = 0;
function uid() { return "u" + (++uidCounter); }

/* -------- Render -------- */
function renderAll() {
  const app = document.getElementById("app");
  const picker = document.getElementById("lessonPicker");
  app.innerHTML = "";
  picker.innerHTML = '<option value="all">Tất cả bài</option>';
  DATA.forEach((lesson, li) => {
    const option = document.createElement("option");
    option.value = String(li);
    option.textContent = `Bài ${li + 1}`;
    picker.appendChild(option);

    const section = document.createElement("section");
    section.className = "lesson-section";
    section.dataset.lessonIndex = String(li);
    const title = document.createElement("div");
    title.className = "lesson-title";
    title.textContent = lesson.lesson;
    section.appendChild(title);

    lesson.items.forEach((item, qi) => {
      section.appendChild(renderQuestion(item, `${li}-${qi}`));
    });
    app.appendChild(section);
  });
  updateStats();
}

function filterLessons(value) {
  document.querySelectorAll(".lesson-section").forEach(section => {
    section.hidden = value !== "all" && section.dataset.lessonIndex !== value;
  });
  updateStats();
}

function renderQuestion(item, key) {
  const card = document.createElement("div");
  card.className = "q-card";
  card.dataset.key = key;
  card.dataset.type = item.type;
  card.dataset.checked = "0";

  const head = document.createElement("div");
  head.className = "q-head";
  const num = document.createElement("div");
  num.className = "q-num";
  const idx = key.split("-").map(Number);
  num.textContent = `Câu ${idx[1] + 1}`;
  const qtext = document.createElement("div");
  qtext.innerHTML = `<div class="q-text">${escapeHtml(item.q)}</div>` +
    (item.n ? `<div class="q-note">Chọn ${item.n} đáp án đúng nhất</div>` : "");
  head.appendChild(num);
  head.appendChild(qtext);
  card.appendChild(head);

  const body = document.createElement("div");
  card.appendChild(body);

  if (item.type === "single" || item.type === "multiple") {
    body.className = "options";
    item.options.forEach((opt, i) => {
      const lab = document.createElement("label");
      lab.className = "opt";
      lab.dataset.i = i;
      const inp = document.createElement("input");
      inp.type = item.type === "single" ? "radio" : "checkbox";
      inp.name = "q_" + key;
      inp.value = i;
      lab.appendChild(inp);
      const span = document.createElement("span");
      span.textContent = opt;
      lab.appendChild(span);
      const mark = document.createElement("span");
      mark.className = "mark";
      lab.appendChild(mark);
      lab.addEventListener("change", () => {
        if (card.dataset.checked === "1") return;
        if (item.type === "single") {
          body.querySelectorAll(".opt").forEach(o => o.classList.remove("sel"));
        }
        lab.classList.toggle("sel", inp.checked);
        if (item.type === "multiple" && item.n) {
          const sel = body.querySelectorAll("input:checked");
          if (sel.length > item.n) {
            inp.checked = false;
            lab.classList.remove("sel");
          }
        }
      });
      body.appendChild(lab);
    });
  }

  else if (item.type === "tf") {
    body.className = "tf-list";
    item.statements.forEach((st, i) => {
      const row = document.createElement("div");
      row.className = "tf-row";
      row.dataset.i = i;
      const t = document.createElement("div");
      t.className = "tf-text";
      t.textContent = (i + 1) + ". " + st.text;
      row.appendChild(t);
      const btns = document.createElement("div");
      btns.className = "tf-btns";
      ["Đúng", "Sai"].forEach((label, k) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = label;
        b.dataset.val = k === 0 ? "true" : "false";
        b.addEventListener("click", () => {
          if (card.dataset.checked === "1") return;
          btns.querySelectorAll("button").forEach(x => x.classList.remove("active"));
          b.classList.add("active");
        });
        btns.appendChild(b);
      });
      row.appendChild(btns);
      const mk = document.createElement("span");
      mk.className = "tf-mark";
      row.appendChild(mk);
      body.appendChild(row);
    });
  }

  else if (item.type === "fill") {
    body.className = "fill-wrap";
    item.blanks.forEach((ansList, i) => {
      const line = document.createElement("div");
      line.className = "fill-line";
      const lab = document.createElement("label");
      lab.textContent = item.blanks.length > 1 ? `Ô (${i + 1}):` : "Trả lời:";
      const inp = document.createElement("input");
      inp.type = "text";
      inp.placeholder = "Nhập câu trả lời...";
      line.appendChild(lab);
      line.appendChild(inp);
      body.appendChild(line);
    });
  }

  else if (item.type === "match") {
    body.className = "match-wrap";
    // pool of right options shuffled
    const rightVals = item.pairs.map(p => p[1]);
    const pool = document.createElement("div");
    pool.className = "pool";
    pool.dataset.pool = key;
    shuffle(rightVals).forEach(rv => {
      pool.appendChild(makeChip(rv, key));
    });

    item.pairs.forEach((pair, i) => {
      const row = document.createElement("div");
      row.className = "match-row";
      row.dataset.i = i;
      const left = document.createElement("div");
      left.className = "match-left";
      left.textContent = pair[0];
      const dz = document.createElement("div");
      dz.className = "dropzone";
      dz.dataset.i = i;
      dz.dataset.key = key;
      const ph = document.createElement("span");
      ph.className = "placeholder";
      ph.textContent = "Kéo thả đáp án vào đây";
      dz.appendChild(ph);
      setupDropzone(dz);
      row.appendChild(left);
      row.appendChild(dz);
      body.appendChild(row);
    });
    body.appendChild(pool);
  }

  // Actions
  const actions = document.createElement("div");
  actions.className = "q-actions";
  const btnCheck = document.createElement("button");
  btnCheck.className = "btn-check";
  btnCheck.textContent = "Kiểm tra";
  btnCheck.addEventListener("click", () => checkQuestion(card, item));
  const btnRetry = document.createElement("button");
  btnRetry.className = "btn-retry";
  btnRetry.textContent = "🔄 Làm lại câu này";
  btnRetry.style.display = "none";
  btnRetry.addEventListener("click", () => retryQuestion(card, item));
  const btnShow = document.createElement("button");
  btnShow.className = "btn-show";
  btnShow.textContent = "Xem đáp án";
  btnShow.addEventListener("click", () => showAnswer(card, item));
  const msg = document.createElement("span");
  msg.className = "result-msg";

  actions.appendChild(btnCheck);
  actions.appendChild(btnRetry);
  actions.appendChild(btnShow);
  actions.appendChild(msg);
  card.appendChild(actions);

  return card;
}

function makeChip(text, key) {
  const chip = document.createElement("div");
  chip.className = "chip";
  chip.draggable = true;
  chip.textContent = text;
  chip.dataset.val = text;
  chip.dataset.key = key;
  chip.id = uid();
  chip.addEventListener("dragstart", e => {
    e.dataTransfer.setData("text/plain", chip.id);
    e.dataTransfer.effectAllowed = "move";
  });
  return chip;
}

function setupDropzone(dz) {
  dz.addEventListener("dragover", e => {
    e.preventDefault();
    dz.classList.add("over");
  });
  dz.addEventListener("dragleave", () => dz.classList.remove("over"));
  dz.addEventListener("drop", e => {
    e.preventDefault();
    dz.classList.remove("over");
    const id = e.dataTransfer.getData("text/plain");
    const chip = document.getElementById(id);
    if (!chip) return;
    // remove placeholder
    const ph = dz.querySelector(".placeholder");
    if (ph) ph.remove();
    // if there is already a chip, move back to pool
    const existing = dz.querySelector(".chip");
    const key = dz.dataset.key;
    const pool = document.querySelector(`.pool[data-pool="${key}"]`);
    if (existing) pool.appendChild(existing);
    dz.appendChild(chip);
  });
}

// allow dropping back to pool
document.addEventListener("dragover", e => {
  const p = e.target.closest && e.target.closest(".pool");
  if (p) e.preventDefault();
});
document.addEventListener("drop", e => {
  const p = e.target.closest && e.target.closest(".pool");
  if (!p) return;
  e.preventDefault();
  const id = e.dataTransfer.getData("text/plain");
  const chip = document.getElementById(id);
  if (!chip) return;
  // restore placeholder in old zone
  const oldZone = chip.parentElement;
  if (oldZone && oldZone.classList.contains("dropzone")) {
    const ph = document.createElement("span");
    ph.className = "placeholder";
    ph.textContent = "Kéo thả đáp án vào đây";
    oldZone.appendChild(ph);
  }
  p.appendChild(chip);
});

/* -------- Check -------- */
function checkQuestion(card, item) {
  if (card.dataset.checked === "1") return;
  let isCorrect = false;
  let answered = true;

  if (item.type === "single" || item.type === "multiple") {
    const opts = card.querySelectorAll(".opt");
    const selected = [];
    opts.forEach(o => {
      const inp = o.querySelector("input");
      if (inp.checked) selected.push(Number(o.dataset.i));
    });
    if (selected.length === 0) { answered = false; }
    const correctSet = new Set(item.correct);
    isCorrect = selected.length === item.correct.length &&
                selected.every(x => correctSet.has(x));
    opts.forEach(o => {
      const i = Number(o.dataset.i);
      const inp = o.querySelector("input");
      const mark = o.querySelector(".mark");
      o.classList.remove("sel");
      if (correctSet.has(i)) {
        o.classList.add("ok");
        mark.textContent = "✓";
      } else if (selected.includes(i)) {
        o.classList.add("bad");
        mark.textContent = "✗";
      }
      inp.disabled = true;
    });
  }

  else if (item.type === "tf") {
    const rows = card.querySelectorAll(".tf-row");
    let anyMissing = false;
    rows.forEach((row, i) => {
      const st = item.statements[i];
      const active = row.querySelector(".tf-btns button.active");
      if (!active) { anyMissing = true; return; }
      const userVal = active.dataset.val === "true";
      const ok = userVal === st.correct;
      row.classList.add(ok ? "ok" : "bad");
      row.querySelector(".tf-mark").textContent = ok ? "✓" : "✗";
      row.querySelectorAll(".tf-btns button").forEach(b => b.disabled = true);
    });
    if (anyMissing) answered = false;
    isCorrect = !anyMissing && rows.length > 0 &&
      Array.from(rows).every((row, i) => {
        const active = row.querySelector(".tf-btns button.active");
        return active && (active.dataset.val === "true") === item.statements[i].correct;
      });
  }

  else if (item.type === "fill") {
    const inputs = card.querySelectorAll(".fill-line input");
    let allOk = true;
    inputs.forEach((inp, i) => {
      const userAns = normalize(inp.value);
      if (!userAns) answered = false;
      const accepted = item.blanks[i].map(normalize);
      const ok = accepted.includes(userAns);
      if (!ok) allOk = false;
      inp.style.borderColor = ok ? "#22c55e" : "#ef4444";
      inp.style.background = ok ? "#f0fdf4" : "#fef2f2";
      inp.disabled = true;
    });
    isCorrect = allOk && answered;
  }

  else if (item.type === "match") {
    const rows = card.querySelectorAll(".match-row");
    let allOk = true;
    rows.forEach((row, i) => {
      const dz = row.querySelector(".dropzone");
      const chip = dz.querySelector(".chip");
      const correctVal = item.pairs[i][1];
      if (!chip) { allOk = false; answered = false; }
      else {
        const ok = chip.dataset.val === correctVal;
        if (!ok) allOk = false;
        chip.classList.add(ok ? "ok" : "bad");
        chip.draggable = false;
      }
      row.classList.add(allOk ? "ok" : (chip ? "bad" : ""));
      if (chip && chip.dataset.val !== correctVal) row.classList.add("bad");
    });
    isCorrect = allOk && answered;
  }

  if (!answered) {
    const m = card.querySelector(".result-msg");
    m.className = "result-msg bad";
    m.textContent = "⚠ Bạn chưa trả lời đầy đủ!";
    return;
  }

  card.dataset.checked = "1";
  card.classList.add(isCorrect ? "correct" : "wrong");

  const msg = card.querySelector(".result-msg");
  const btnCheck = card.querySelector(".btn-check");
  const btnRetry = card.querySelector(".btn-retry");
  btnCheck.style.display = "none";

  if (isCorrect) {
    msg.className = "result-msg ok";
    msg.textContent = "✓ Chính xác!";
    stats.ok++;
  } else {
    msg.className = "result-msg bad";
    msg.textContent = "✗ Chưa đúng. Hãy làm lại hoặc xem đáp án.";
    btnRetry.style.display = "inline-block";
    stats.bad++;
  }
  updateStats();
}

function retryQuestion(card, item) {
  card.dataset.checked = "0";
  card.classList.remove("correct", "wrong");
  const msg = card.querySelector(".result-msg");
  msg.textContent = "";
  msg.className = "result-msg";

  if (item.type === "single" || item.type === "multiple") {
    card.querySelectorAll(".opt").forEach(o => {
      o.classList.remove("ok", "bad", "sel");
      const inp = o.querySelector("input");
      inp.checked = false;
      inp.disabled = false;
      o.querySelector(".mark").textContent = "";
    });
  } else if (item.type === "tf") {
    card.querySelectorAll(".tf-row").forEach(row => {
      row.classList.remove("ok", "bad");
      row.querySelector(".tf-mark").textContent = "";
      row.querySelectorAll(".tf-btns button").forEach(b => {
        b.disabled = false;
        b.classList.remove("active");
      });
    });
  } else if (item.type === "fill") {
    card.querySelectorAll(".fill-line input").forEach(inp => {
      inp.value = "";
      inp.disabled = false;
      inp.style.borderColor = "";
      inp.style.background = "";
    });
  } else if (item.type === "match") {
    // move all chips back to pool and shuffle
    const pool = card.querySelector(".pool");
    card.querySelectorAll(".dropzone").forEach(dz => {
      const chip = dz.querySelector(".chip");
      if (chip) pool.appendChild(chip);
      dz.querySelectorAll(".chip").forEach(c => c.remove());
      if (!dz.querySelector(".placeholder")) {
        const ph = document.createElement("span");
        ph.className = "placeholder";
        ph.textContent = "Kéo thả đáp án vào đây";
        dz.appendChild(ph);
      }
    });
    pool.querySelectorAll(".chip").forEach(c => {
      c.classList.remove("ok", "bad");
      c.draggable = true;
    });
    card.querySelectorAll(".match-row").forEach(r => r.classList.remove("ok", "bad"));
  }

  const btnCheck = card.querySelector(".btn-check");
  const btnRetry = card.querySelector(".btn-retry");
  btnCheck.style.display = "inline-block";
  btnRetry.style.display = "none";

  // adjust stats: subtract previous result of this question
  // (determined by classes before removal — we already removed them, so track via a flag)
  // To keep it simple, we track via data attribute
  if (card.dataset.wasCorrect === "1") stats.ok--;
  if (card.dataset.wasCorrect === "0") stats.bad--;
  card.dataset.wasCorrect = "";
  updateStats();
}

function showAnswer(card, item) {
  if (item.type === "single" || item.type === "multiple") {
    card.querySelectorAll(".opt").forEach(o => {
      const i = Number(o.dataset.i);
      if (item.correct.includes(i)) {
        o.classList.add("ok");
        o.querySelector(".mark").textContent = "✓";
      }
    });
  } else if (item.type === "tf") {
    card.querySelectorAll(".tf-row").forEach((row, i) => {
      const correct = item.statements[i].correct;
      const btns = row.querySelectorAll(".tf-btns button");
      btns.forEach(b => {
        if ((b.dataset.val === "true") === correct) b.classList.add("active");
      });
      row.classList.add("ok");
      row.querySelector(".tf-mark").textContent = correct ? "Đúng ✓" : "Sai ✗";
    });
  } else if (item.type === "fill") {
    card.querySelectorAll(".fill-line input").forEach((inp, i) => {
      inp.value = item.blanks[i][0];
      inp.style.borderColor = "#22c55e";
      inp.style.background = "#f0fdf4";
    });
  } else if (item.type === "match") {
    card.querySelectorAll(".match-row").forEach((row, i) => {
      const dz = row.querySelector(".dropzone");
      dz.querySelectorAll(".chip").forEach(c => c.remove());
      dz.querySelectorAll(".placeholder").forEach(p => p.remove());
      const chip = document.createElement("div");
      chip.className = "chip ok";
      chip.textContent = item.pairs[i][1];
      dz.appendChild(chip);
    });
    const pool = card.querySelector(".pool");
    if (pool) pool.innerHTML = "";
  }
}

/* -------- Stats -------- */
function updateStats() {
  const visibleCards = [...document.querySelectorAll(".lesson-section:not([hidden]) .q-card")];
  stats.ok = visibleCards.filter(card => card.classList.contains("correct")).length;
  stats.bad = visibleCards.filter(card => card.classList.contains("wrong")).length;
  document.getElementById("score").textContent = `${stats.ok} / ${visibleCards.length}`;
  document.getElementById("cntOk").textContent = stats.ok;
  document.getElementById("cntBad").textContent = stats.bad;
}

function resetAll() {
  stats = { ok: 0, bad: 0 };
  renderAll();
}

function scrollToTop() {
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* track wasCorrect in checkQuestion */
const _origCheck = checkQuestion;
checkQuestion = function(card, item) {
  _origCheck(card, item);
  if (card.dataset.checked === "1") {
    card.dataset.wasCorrect = card.classList.contains("correct") ? "1" : "0";
  }
};

renderAll();
</script>
